# BeFree Gantry style presets. Generated from tools/palettes.py (every text/background pair checked >= 4.5:1 WCAG AA).

preset1:
  image: 'gantry-admin://images/presets/meld-neon.png'
  description: 'Meld Neon (default)'
  colors:
    - '#9bff2e'
    - '#25f4ee'
    - '#d7c785'

  styles:
    base:
      background: '#050505'
      text-color: '#f1f1ec'
      body-font: 'outfit, sans-serif'
      heading-font: 'barlowcondensed, sans-serif'
    accent:
      color-1: '#9bff2e'
      color-2: '#25f4ee'
    header:
      background: '#050505'
      text-color: '#f1f1ec'
    navigation:
      background: '#08182e'
      text-color: '#e7eef6'
      overlay: 'rgba(0, 0, 0, 0.4)'
