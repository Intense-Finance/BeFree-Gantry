      background: '#0a0a09'
      text-color: '#f1f1ec'
      image: ''
    feature:
      background: '#0a0a09'
      text-color: '#f1f1ec'
    subfeature:
      background: '#070d14'
      text-color: '#e7eef6'
    main:
      background: '#0a0a09'
      text-color: '#f1f1ec'
    footer:
      background: '#070d14'
      text-color: '#8b8b84'
    offcanvas:
      background: '#070d14'
      text-color: '#f1f1ec'
      toggle-color: '#f1f1ec'
    befree:
      variant: 'standard'
      radius: '14px'
      gold: '#d7c785'
      gold-text: '#d7c785'
      gold-ink: '#1c1708'
      card: '#101820'
      raised: '#162232'
      line: '#2a3a4e'
      muted: '#8ea0b5'
      navy: '#0a2344'
      paper: '#e7eef6'
