version: 2

preset:
  image: 'gantry-admin://images/layouts/befree-both-sidebars.png'
  name: both_sidebars

layout:
  /header/:
    - [logo 30, position-header 70]

  /navigation/:
    - menu

  /slideshow/: { }

  /container-main/:
    -
      - sidebar 22:
          - position-sidebar
      - mainbar 56:
          - position-breadcrumbs
          - system-messages
          - system-content
      - aside 22:
          - position-aside
          - sister-site

  /footer/:
    - position-footer
    - [copyright 40, spacer 30, branding 30]

  offcanvas:
    - mobile-menu

structure:
  slideshow:
    type: section
    attributes:
      boxed: 2
  sidebar:
    subtype: aside
    block:
      fixed: 1
  aside:
    block:
      fixed: 1
